<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MAKAN Screen Translator Overlay</title>
<style>
  @font-face {
    font-family: 'Vazirmatn';
    src: url('../fonts/Vazirmatn.woff2') format('woff2');
    font-weight: 100 900;
    font-style: normal;
    font-display: swap;
  }

  :root {
    --bg: #05070D;
    --surface: #0B111C;
    --surface2: #101826;
    --surface3: #182438;
    --glass: rgba(11, 17, 28, 0.96);
    --border: rgba(255, 255, 255, 0.10);
    --border2: rgba(255, 255, 255, 0.18);
    --accent: #58A6FF;
    --accent-dim: rgba(88, 166, 255, 0.14);
    --green: #22E58A;
    --cyan: #13C8F5;
    --grad: linear-gradient(100deg, #22E58A 0%, #13C8F5 50%, #3B6BFF 100%);
    --cta: #FFB44A;
    --text: #EAF1F7;
    --muted: #93A1B5;
    --faint: #5E6B7E;
    --err: #FF6B7A;
    --r: 12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    color: var(--text);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Vazirmatn', sans-serif;
    font-size: 13.5px;
    line-height: 1.5;
    user-select: none;
    margin: 0;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card-container {
    position: relative;
    width: min(460px, calc(100vw - 16px));
    max-width: calc(100vw - 16px);
    max-height: calc(100vh - 16px);
    height: 100%;
    margin: auto;
    background: var(--glass);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border2);
    border-radius: var(--r);
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255, 255, 255, 0.08);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-sizing: border-box;
  }

  /* Header draggable bar */
  .header {
    min-height: 42px;
    height: auto;
    background: rgba(255, 255, 255, 0.03);
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    row-gap: 6px;
    column-gap: 8px;
    padding: 6px 10px;
    position: sticky;
    top: 0;
    z-index: 10;
    flex-shrink: 0;
    box-sizing: border-box;
    -webkit-app-region: drag;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 700;
    color: var(--text);
    white-space: nowrap;
    letter-spacing: 0.02em;
    flex-shrink: 0;
  }

  .mark {
    width: 20px;
    height: 20px;
    border-radius: 5px;
    background: var(--grad);
    display: grid;
    place-items: center;
    color: #03111A;
    font-size: 11px;
    font-weight: 800;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  /* Header toolbar and actions */
  .header-toolbar {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    flex-shrink: 1;
    min-width: 0;
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-inline-start: auto;
    flex-shrink: 0;
  }

  @media (max-width: 440px) {
    .header-actions {
      order: 2;
    }
    .header-toolbar {
      order: 3;
      width: 100%;
      padding-top: 2px;
    }
  }

  .no-drag {
    -webkit-app-region: no-drag;
  }

  .pill {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 5px;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--muted);
    white-space: nowrap;
  }

  .pill.detected {
    color: var(--green);
    background: rgba(34, 229, 138, 0.12);
    border-color: rgba(34, 229, 138, 0.28);
  }

  .lang-arrow {
    color: var(--muted);
    font-size: 11px;
  }

  select.select-clean {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 6px;
    border-radius: 5px;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    outline: none;
    cursor: pointer;
  }

  select.select-clean:hover {
    border-color: var(--accent);
  }

  .sp { flex: 1; }

  .icon-btn {
    width: 26px;
    height: 26px;
    border-radius: 6px;
    background: transparent;
    border: none;
    color: var(--muted);
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .icon-btn:hover {
    background: var(--surface2);
    color: var(--text);
  }

  .icon-btn.active {
    color: var(--accent);
    background: var(--accent-dim);
  }

  /* Body content */
  .body {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    user-select: text;
    box-sizing: border-box;
  }

  .body::-webkit-scrollbar {
    width: 6px;
  }
  .body::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.16);
    border-radius: 3px;
  }

  /* Loading state */
  .state-loading {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 28px 0;
    color: var(--muted);
    font-size: 13px;
  }

  .spinner {
    width: 22px;
    height: 22px;
    border: 2px solid rgba(88, 166, 255, 0.2);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* Error state */
  .state-error {
    background: rgba(255, 107, 122, 0.10);
    border: 1px solid rgba(255, 107, 122, 0.3);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 12.5px;
    color: #ff9ca8;
    line-height: 1.5;
  }

  .error-guidance {
    margin-top: 6px;
    font-size: 11.5px;
    color: var(--muted);
  }

  /* Original OCR expandable section */
  .original-wrap {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 7px;
    overflow: hidden;
    font-size: 12px;
  }

  .original-header {
    padding: 6px 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    color: var(--muted);
    font-weight: 600;
  }

  .original-header:hover {
    color: var(--text);
    background: rgba(255, 255, 255, 0.02);
  }

  .original-content {
    padding: 8px 10px;
    border-top: 1px solid var(--border);
    color: #cdd7e4;
    white-space: pre-wrap;
    word-break: break-word;
    font-family: Consolas, 'JetBrains Mono', monospace;
    font-size: 12px;
    max-height: 120px;
    overflow-y: auto;
  }

  .original-content[dir="rtl"] {
    font-family: 'Vazirmatn', Tahoma, sans-serif;
    font-size: 13.5px;
    line-height: 1.7;
    text-align: right;
    direction: rtl;
  }

  /* Main translated text */
  .trans-content {
    font-size: 14.5px;
    line-height: 1.65;
    color: var(--text);
    white-space: pre-wrap;
    word-break: break-word;
    min-height: 48px;
  }

  .trans-content[dir="rtl"] {
    font-family: 'Vazirmatn', Tahoma, sans-serif;
    font-size: 15px;
    line-height: 1.75;
    text-align: right;
  }

  /* Footer action bar */
  .footer {
    min-height: 42px;
    height: auto;
    background: rgba(0, 0, 0, 0.3);
    border-top: 1px solid var(--border);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    padding: 6px 10px;
    flex-shrink: 0;
    box-sizing: border-box;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    height: 28px;
    padding: 0 8px;
    border-radius: 6px;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
    flex-shrink: 1;
    min-width: 0;
    white-space: nowrap;
  }

  .btn:hover {
    background: var(--surface3);
    color: var(--text);
    border-color: var(--border2);
  }

  .btn.copied {
    color: var(--green);
    border-color: var(--green);
  }

  .btn span {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .btn-open-app {
    color: var(--accent);
    background: transparent;
    border: none;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 6px;
    border-radius: 6px;
    flex-shrink: 1;
    min-width: 0;
    white-space: nowrap;
  }

  .btn-open-app span {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .btn-open-app:hover {
    background: var(--accent-dim);
  }

  .btn-live {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 26px;
    padding: 0 9px;
    border-radius: 6px;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 11.5px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
    flex-shrink: 0;
  }
  .btn-live:hover {
    background: var(--surface3);
    color: var(--text);
    border-color: var(--border2);
  }
  .btn-live.active {
    background: rgba(34, 229, 138, 0.16);
    border-color: rgba(34, 229, 138, 0.55);
    color: var(--green);
    box-shadow: 0 0 10px rgba(34, 229, 138, 0.22);
  }
  .live-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--muted);
    transition: background 0.2s ease;
  }
  .btn-live.active .live-dot {
    background: var(--green);
    box-shadow: 0 0 7px var(--green);
    animation: liveBlink 1.2s ease-in-out infinite;
  }
  @keyframes liveBlink {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.35; transform: scale(0.8); }
  }

  .btn-close-header {
    background: rgba(255, 107, 122, 0.16) !important;
    border: 1px solid rgba(255, 107, 122, 0.4) !important;
    color: #FFB4B8 !important;
    border-radius: 6px;
    width: 28px;
    height: 28px;
    flex-shrink: 0;
  }
  .btn-close-header:hover {
    background: rgba(255, 107, 122, 0.45) !important;
    color: #FFF !important;
  }

  .btn-footer-close {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 0 10px;
    height: 28px;
    border-radius: 6px;
    border: 1px solid rgba(255, 107, 122, 0.35);
    background: rgba(255, 107, 122, 0.12);
    color: #FFB4B8;
    cursor: pointer;
    font-size: 11.5px;
    font-weight: 600;
    transition: background 0.15s, color 0.15s;
    margin-inline-start: auto;
    flex-shrink: 0;
    white-space: nowrap;
  }
  .btn-footer-close:hover {
    background: rgba(255, 107, 122, 0.35);
    color: #FFF;
  }

  .original-preview {
    font-size: 11px;
    color: var(--muted);
    font-weight: 400;
    max-width: 180px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    margin-inline-start: 8px;
  }

  /* RTL / Persian layout */
  html[dir="rtl"] body, body[dir="rtl"] {
    direction: rtl;
  }
</style>
</head>
<body>

<div class="card-container" id="cardContainer">
  <!-- Draggable Title Bar -->
  <div class="header">
    <div class="brand">
      <div class="mark">M</div>
      <span style="font-size:11.5px" id="brandTitle">Translate</span>
    </div>

    <div class="header-toolbar no-drag" id="headerToolbar">
      <span class="pill detected no-drag" id="sourceLangPill">EN</span>
      <span class="lang-arrow">→</span>

      <select class="select-clean no-drag" id="targetLangSel" title="Target Language">
        <option value="fa">فارسی</option>
        <option value="en">English</option>
        <option value="ar">العربية</option>
        <option value="de">Deutsch</option>
        <option value="fr">Français</option>
        <option value="es">Español</option>
        <option value="tr">Türkçe</option>
        <option value="zh">中文</option>
        <option value="ru">Русский</option>
      </select>

      <select class="select-clean no-drag" id="engineSel" title="Translation Engine">
        <option value="auto">Auto</option>
        <option value="google">Google</option>
        <option value="gemini">Gemini</option>
        <option value="groq">Groq</option>
        <option value="ollama">Ollama</option>
        <option value="mymemory">MyMemory</option>
      </select>
    </div>

    <div class="header-actions no-drag">
      <button class="btn-live no-drag" id="btnLiveToggle" title="Live Video Mode: continuously track and translate video subtitles">
        <span class="live-dot"></span>
        <span id="liveBtnLabel">Live Video</span>
      </button>

      <button class="icon-btn" id="btnPin" title="Pin overlay (stay on top)">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="12" y1="17" x2="12" y2="22"/><path d="M5 17h14v-2l-2-2V5a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v8l-2 2v2z"/></svg>
      </button>

      <button class="icon-btn btn-close-header" id="btnClose" title="Close (Esc)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
  </div>

  <!-- Content Body -->
  <div class="body">
    <!-- Loading spinner -->
    <div class="state-loading" id="stateLoading">
      <div class="spinner"></div>
      <span id="loadingMsg">Extracting text with Windows OCR…</span>
    </div>

    <!-- Error message -->
    <div class="state-error" id="stateError" style="display: none;">
      <div id="errorText">Recognition failed</div>
      <div class="error-guidance" id="errorGuidance" style="display: none;"></div>
      <div style="margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap;">
        <button class="btn no-drag" id="btnErrorRetry" style="padding: 3px 10px; font-size: 11px;">Retry</button>
        <button class="btn-open-app no-drag" id="btnErrorOpenApp" style="padding: 3px 10px; font-size: 11px;" title="Open in Windows app: all features, OCR, offline models">Open in Windows app</button>
        <button class="btn-open-app no-drag" id="btnErrorOpenBrowser" style="padding: 3px 10px; font-size: 11px;" title="Open in browser: opens the web app at the Web App URL (makanlab.tech), uses your browser (Chrome on-device translation works in Chrome)">Open in browser</button>
      </div>
    </div>

    <!-- Original OCR text collapsible -->
    <div class="original-wrap" id="originalWrap" style="display: none;">
      <div class="original-header" id="originalToggle">
        <div style="display: flex; align-items: center; overflow: hidden;">
          <span>Original (<span id="ocrLangLabel">en-US</span>):</span>
          <span class="original-preview" id="originalPreview"></span>
        </div>
        <span id="toggleIcon">▼</span>
      </div>
      <div class="original-content" id="originalContent" style="display: none;"></div>
    </div>

    <!-- Translation text -->
    <div class="trans-content" id="transContent" dir="rtl" style="display: none;"></div>
  </div>

  <!-- Footer Toolbar -->
  <div class="footer">
    <button class="btn no-drag" id="btnCopyTrans" title="Copy Translation">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
      <span id="copyTransLabel">Copy</span>
    </button>

    <button class="btn no-drag" id="btnCopyOrig" title="Copy Original Text">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      <span id="copyOrigLabel">Original</span>
    </button>

    <button class="btn no-drag" id="btnRetry" title="Retry Translation">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></svg>
      <span id="retryLabel">Retry</span>
    </button>

    <button class="btn no-drag" id="btnReselectZone" title="Set/reselect video subtitle region">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/></svg>
      <span id="zoneLabel">Zone</span>
    </button>

    <button class="btn-open-app no-drag" id="btnOpenInApp" title="Open in Windows app: all features, OCR, offline models">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
      <span id="openInAppLabel">Open in Windows app</span>
    </button>

    <button class="btn-open-app no-drag" id="btnOpenBrowser" title="Open in browser: opens the web app at the Web App URL (makanlab.tech), uses your browser (Chrome on-device translation works in Chrome)">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
      <span id="openBrowserLabel">Open in browser</span>
    </button>

    <button class="btn-footer-close no-drag" id="btnFooterClose" title="Close (Esc)">
      <span id="footerCloseLabel">✕ Close</span>
    </button>
  </div>
</div>

<script>
  let isPinned = false;
  let rawOcrText = '';
  let currentTranslation = '';
  let sourceLang = 'en';
  let targetLang = 'fa';
  let engine = 'auto';

  // DOM elements
  const cardContainer = document.getElementById('cardContainer') || document.querySelector('.card-container');
  const stateLoading = document.getElementById('stateLoading');
  const loadingMsg = document.getElementById('loadingMsg');
  const stateError = document.getElementById('stateError');
  const errorText = document.getElementById('errorText');
  const errorGuidance = document.getElementById('errorGuidance');
  const originalWrap = document.getElementById('originalWrap');
  const originalToggle = document.getElementById('originalToggle');
  const originalContent = document.getElementById('originalContent');
  const toggleIcon = document.getElementById('toggleIcon');
  const transContent = document.getElementById('transContent');
  const sourceLangPill = document.getElementById('sourceLangPill');
  const targetLangSel = document.getElementById('targetLangSel');
  const engineSel = document.getElementById('engineSel');
  const btnPin = document.getElementById('btnPin');
  const btnClose = document.getElementById('btnClose');
  const btnFooterClose = document.getElementById('btnFooterClose');
  const btnCopyTrans = document.getElementById('btnCopyTrans');
  const copyTransLabel = document.getElementById('copyTransLabel');
  const btnCopyOrig = document.getElementById('btnCopyOrig');
  const copyOrigLabel = document.getElementById('copyOrigLabel');
  const btnRetry = document.getElementById('btnRetry');
  const retryLabel = document.getElementById('retryLabel');
  const btnReselectZone = document.getElementById('btnReselectZone');
  const zoneLabel = document.getElementById('zoneLabel');
  const btnOpenInApp = document.getElementById('btnOpenInApp');
  const openInAppLabel = document.getElementById('openInAppLabel');
  const btnOpenBrowser = document.getElementById('btnOpenBrowser');
  const openBrowserLabel = document.getElementById('openBrowserLabel');
  const footerCloseLabel = document.getElementById('footerCloseLabel');
  const brandTitle = document.getElementById('brandTitle');
  const btnErrorRetry = document.getElementById('btnErrorRetry');
  const btnErrorOpenApp = document.getElementById('btnErrorOpenApp');
  const btnErrorOpenBrowser = document.getElementById('btnErrorOpenBrowser');
  const originalPreview = document.getElementById('originalPreview');
  const ocrLangLabel = document.getElementById('ocrLangLabel');
  const btnLiveToggle = document.getElementById('btnLiveToggle');
  const liveBtnLabel = document.getElementById('liveBtnLabel');

  // Viewport clamping & dragging
  function clampPanelPosition(x, y) {
    const pad = 8;
    const rect = cardContainer.getBoundingClientRect();
    const maxX = Math.max(pad, window.innerWidth - rect.width - pad);
    const maxY = Math.max(pad, window.innerHeight - rect.height - pad);
    const clampedX = Math.min(Math.max(pad, x), maxX);
    const clampedY = Math.min(Math.max(pad, y), maxY);
    return { x: clampedX, y: clampedY };
  }

  function setPanelPosition(x, y) {
    cardContainer.style.position = 'fixed';
    cardContainer.style.margin = '0';
    const clamped = clampPanelPosition(x, y);
    cardContainer.style.left = clamped.x + 'px';
    cardContainer.style.top = clamped.y + 'px';
    cardContainer.style.right = 'auto';
    cardContainer.style.bottom = 'auto';
  }

  function ensureInViewport() {
    if (cardContainer.style.position === 'fixed') {
      const rect = cardContainer.getBoundingClientRect();
      setPanelPosition(rect.left, rect.top);
    }
  }
  window.addEventListener('resize', ensureInViewport);

  let isDragging = false;
  let dragStartX = 0;
  let dragStartY = 0;
  let initialCardX = 0;
  let initialCardY = 0;

  const header = document.querySelector('.header');
  if (header) {
    header.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.no-drag')) return;
      isDragging = true;
      try { header.setPointerCapture(e.pointerId); } catch {}
      const rect = cardContainer.getBoundingClientRect();
      initialCardX = rect.left;
      initialCardY = rect.top;
      dragStartX = e.clientX;
      dragStartY = e.clientY;
    });

    header.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - dragStartX;
      const dy = e.clientY - dragStartY;
      setPanelPosition(initialCardX + dx, initialCardY + dy);
    });

    const stopDrag = (e) => {
      if (!isDragging) return;
      isDragging = false;
      try { header.releasePointerCapture(e.pointerId); } catch {}
    };
    header.addEventListener('pointerup', stopDrag);
    header.addEventListener('pointercancel', stopDrag);
  }

  window.setOverlayPosition = (x, y) => {
    setPanelPosition(x, y);
  };

  function applyOverlayI18n(lang) {
    const isFa = lang === 'fa';
    document.documentElement.lang = isFa ? 'fa' : 'en';
    document.documentElement.dir = isFa ? 'rtl' : 'ltr';
    document.body.dir = isFa ? 'rtl' : 'ltr';

    if (brandTitle) brandTitle.textContent = isFa ? 'ترجمه' : 'Translate';
    if (liveBtnLabel) liveBtnLabel.textContent = isFa ? 'ویدیو زنده' : 'Live Video';
    if (copyTransLabel) copyTransLabel.textContent = isFa ? 'کپی' : 'Copy';
    if (copyOrigLabel) copyOrigLabel.textContent = isFa ? 'متن اصلی' : 'Original';
    if (retryLabel) retryLabel.textContent = isFa ? 'تلاش مجدد' : 'Retry';
    if (zoneLabel) zoneLabel.textContent = isFa ? 'ناحیه' : 'Zone';
    if (openInAppLabel) openInAppLabel.textContent = isFa ? 'باز کردن در برنامه ویندوز' : 'Open in Windows app';
    if (openBrowserLabel) openBrowserLabel.textContent = isFa ? 'باز کردن در مرورگر' : 'Open in browser';
    if (footerCloseLabel) footerCloseLabel.textContent = isFa ? '✕ بستن' : '✕ Close';
    if (btnClose) btnClose.title = isFa ? 'بستن (Esc)' : 'Close (Esc)';
    if (btnPin) btnPin.title = isFa ? 'سنجاق کردن' : 'Pin overlay (stay on top)';
  }

  try {
    const params = new URLSearchParams(window.location.search);
    if (params.get('ui') === 'fa' || params.get('lang') === 'fa') {
      applyOverlayI18n('fa');
    }
  } catch {}
  window.setOverlayLanguage = applyOverlayI18n;

  // Toggle original text
  originalToggle.onclick = () => {
    const isHidden = originalContent.style.display === 'none';
    originalContent.style.display = isHidden ? 'block' : 'none';
    toggleIcon.textContent = isHidden ? '▲' : '▼';
  };

  // Target language change
  targetLangSel.onchange = () => {
    targetLang = targetLangSel.value;
    triggerTranslate();
  };

  // Engine change
  engineSel.onchange = () => {
    engine = engineSel.value;
    triggerTranslate();
  };

  // Pin toggle
  btnPin.onclick = () => {
    isPinned = !isPinned;
    btnPin.classList.toggle('active', isPinned);
    window.makanOverlay?.setPinned(isPinned);
  };

  // Close handlers (header & footer & Escape)
  const closeOverlay = () => {
    cardContainer.style.display = 'none';
    window.makanOverlay?.close();
  };
  btnClose.onclick = closeOverlay;
  if (btnFooterClose) btnFooterClose.onclick = closeOverlay;

  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      closeOverlay();
    }
  });

  // Copy buttons
  btnCopyTrans.onclick = () => {
    if (!currentTranslation) return;
    navigator.clipboard.writeText(currentTranslation);
    btnCopyTrans.classList.add('copied');
    copyTransLabel.textContent = 'Copied!';
    setTimeout(() => {
      btnCopyTrans.classList.remove('copied');
      copyTransLabel.textContent = 'Copy';
    }, 1800);
  };

  btnCopyOrig.onclick = () => {
    if (!rawOcrText) return;
    navigator.clipboard.writeText(rawOcrText);
    btnCopyOrig.classList.add('copied');
    setTimeout(() => btnCopyOrig.classList.remove('copied'), 1800);
  };

  btnRetry.onclick = () => {
    triggerTranslate();
  };

  if (btnOpenInApp) {
    btnOpenInApp.onclick = () => {
      const payload = { text: rawOcrText, src: sourceLang, tgt: targetLang };
      if (window.makanOverlay?.openInMainApp) {
        window.makanOverlay.openInMainApp(payload);
      }
    };
  }

  if (btnOpenBrowser) {
    btnOpenBrowser.onclick = () => {
      const payload = { text: rawOcrText, src: sourceLang, tgt: targetLang };
      if (window.makanOverlay?.openInBrowser) {
        window.makanOverlay.openInBrowser(payload);
      }
    };
  }

  if (btnErrorRetry) {
    btnErrorRetry.onclick = () => triggerTranslate();
  }
  if (btnErrorOpenApp) {
    btnErrorOpenApp.onclick = () => {
      const payload = { text: rawOcrText, src: sourceLang, tgt: targetLang };
      if (window.makanOverlay?.openInMainApp) {
        window.makanOverlay.openInMainApp(payload);
      }
    };
  }
  if (btnErrorOpenBrowser) {
    btnErrorOpenBrowser.onclick = () => {
      const payload = { text: rawOcrText, src: sourceLang, tgt: targetLang };
      if (window.makanOverlay?.openInBrowser) {
        window.makanOverlay.openInBrowser(payload);
      }
    };
  }

  function triggerTranslate() {
    if (!rawOcrText) return;
    showLoading('Translating…');
    window.makanOverlay?.requestTranslation({
      text: rawOcrText,
      src: sourceLang,
      tgt: targetLang,
      engine: engine
    });
  }

  function showLoading(msg) {
    stateLoading.style.display = 'flex';
    loadingMsg.textContent = msg || 'Loading…';
    stateError.style.display = 'none';
    transContent.style.display = 'none';
  }

  function showError(msg, guidance) {
    stateLoading.style.display = 'none';
    stateError.style.display = 'block';
    errorText.textContent = msg || 'An error occurred';
    if (guidance) {
      errorGuidance.style.display = 'block';
      errorGuidance.textContent = guidance;
    } else {
      errorGuidance.style.display = 'none';
    }
    transContent.style.display = 'none';
  }

  function showResult(translation, detectedSrc) {
    stateLoading.style.display = 'none';
    stateError.style.display = 'none';
    currentTranslation = translation || '';
    
    if (detectedSrc) {
      sourceLang = detectedSrc;
      sourceLangPill.textContent = detectedSrc.toUpperCase();
    }

    // Set text direction based on target language or Arabic/Persian characters
    const isRtl = /^(fa|ar|ur|he|ps)/i.test(targetLang) || /[\u0600-\u06FF\u0750-\u077F\uFB50-\uFDFF\uFE70-\uFEFF]/.test(currentTranslation);
    transContent.setAttribute('dir', isRtl ? 'rtl' : 'ltr');
    transContent.textContent = currentTranslation;
    transContent.style.display = 'block';
  }

  // Handle incoming data from main process
  window.makanOverlay?.onOcrResult((data) => {
    if (!data.ok) {
      showError(data.error, data.installationGuidance);
      return;
    }

    rawOcrText = (data.text || '').trim();
    if (!rawOcrText) {
      showError('No text found in selected region.');
      return;
    }

    // Set text direction for original content
    const isOrigRtl = data.isRtl || /^(fa|ar|ur|he|ps)/i.test(data.language || '') || /[\u0600-\u06FF\u0750-\u077F\uFB50-\uFDFF\uFE70-\uFEFF]/.test(rawOcrText);
    originalContent.setAttribute('dir', isOrigRtl ? 'rtl' : 'ltr');

    // Show original text wrap
    originalWrap.style.display = 'block';
    originalContent.textContent = rawOcrText;
    if (originalPreview) {
      originalPreview.textContent = rawOcrText.replace(/\s+/g, ' ').slice(0, 32) + (rawOcrText.length > 32 ? '…' : '');
    }
    ocrLangLabel.textContent = data.language || 'Auto';

    // Update detected source
    const src = (data.language || 'en').split('-')[0].toLowerCase();
    sourceLang = src;
    sourceLangPill.textContent = src.toUpperCase();

    // Trigger translation
    triggerTranslate();
  });

  window.makanOverlay?.onTranslationResult((data) => {
    if (!data.ok) {
      showError(data.error);
      return;
    }
    showResult(data.translation, data.detectedSrc || sourceLang);
  });

  // Live video subtitle controls
  const btnReselectZone = document.getElementById('btnReselectZone');

  btnLiveToggle.onclick = () => {
    window.makanOverlay?.toggleLiveWatcher();
  };

  if (btnReselectZone) {
    btnReselectZone.onclick = () => {
      window.makanOverlay?.reselectZone();
    };
  }

  window.makanOverlay?.onLiveState((state) => {
    if (state && state.active) {
      btnLiveToggle.classList.add('active');
      liveBtnLabel.textContent = 'Live ON';
      if (!isPinned) {
        isPinned = true;
        btnPin.classList.add('active');
        window.makanOverlay?.setPinned(true);
      }
    } else {
      btnLiveToggle.classList.remove('active');
      liveBtnLabel.textContent = 'Live Video';
    }
  });

  // Signal ready to preload and main process so any buffered result is pushed immediately
  if (window.makanOverlay?.ready) {
    window.makanOverlay.ready();
  }
</script>

</body>
</html>
